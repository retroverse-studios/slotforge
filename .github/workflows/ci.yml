name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      studio: ${{ steps.filter.outputs.studio }}
      race: ${{ steps.filter.outputs.race }}
      vision: ${{ steps.filter.outputs.vision }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/core/**'
              - 'content/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            studio:
              - 'apps/studio/**'
              - 'packages/core/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            race:
              - 'apps/race/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            vision:
              - 'services/vision/**'
              - '.github/workflows/ci.yml'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @slotforge/core
      - run: npm run test -w @slotforge/core
      - run: npm run build -w @slotforge/core

  studio:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @slotforge/studio

  race:
    needs: changes
    if: needs.changes.outputs.race == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w @slotforge/race
      - run: npm run build -w @slotforge/race

  vision:
    needs: changes
    if: needs.changes.outputs.vision == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies when a project exists
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No Python project yet. Skipping dependency install."
          fi
      - name: Lint
        run: |
          if [ -f pyproject.toml ] && python -c "import ruff" 2>/dev/null; then
            ruff check .
          else
            echo "No ruff configuration yet."
          fi
      - name: Test
        run: |
          if [ -f pyproject.toml ] && python -c "import pytest" 2>/dev/null; then
            pytest -q
          else
            python -m compileall -q .
          fi

  ci:
    if: always()
    needs: [changes, core, studio, race, vision]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a selected job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
      - name: Pass when selected jobs passed or were skipped
        run: echo "All selected jobs passed or were skipped."
